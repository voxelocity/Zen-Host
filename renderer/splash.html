<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Zen Host</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #eaf0fb;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
      background:
        radial-gradient(70% 70% at 50% 30%, rgba(47,208,131,0.18), transparent 70%),
        linear-gradient(160deg, #10141f, #0a0c12);
      border: 1px solid rgba(255,255,255,0.07);
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    .logo {
      height: 92px; width: auto;
      filter: drop-shadow(0 8px 26px rgba(47,208,131,0.45));
      animation: rise .6s cubic-bezier(.2,.7,.2,1) both, breathe 3s ease-in-out 1s infinite;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.94); } to { opacity: 1; transform: none; } }
    @keyframes breathe { 50% { transform: translateY(-4px); } }
    .title { font-size: 22px; font-weight: 800; letter-spacing: .01em; }
    .sub { font-size: 13px; color: #8a93a8; margin-top: -10px; }
    .bar { width: 200px; height: 5px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .bar::before {
      content: ""; display: block; height: 100%; width: 40%; border-radius: 4px;
      background: linear-gradient(90deg, #2fd083, #4fc3ff);
      box-shadow: 0 0 12px rgba(79,195,255,0.6);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  </style>
</head>
<body>
  <img class="logo" src="assets/zenlogo.png" alt="Zen Host" />
  <div class="title">Zen Host</div>
  <div class="sub">Starting up…</div>
  <div class="bar"></div>
</body>
</html>
