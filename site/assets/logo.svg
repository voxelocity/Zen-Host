<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16203a"/>
      <stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="56%">
      <stop offset="0" stop-color="#2ee6b0" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2ee6b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <ellipse cx="256" cy="240" rx="200" ry="150" fill="url(#glow)"/>

  <g fill="#2fd083">
    <!-- trunk + branch (zig-zag) -->
    <path d="M300 232 C 322 258 296 288 314 316 C 330 342 282 372 264 402"
          fill="none" stroke="#2fd083" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M302 292 C 258 302 214 314 176 314"
          fill="none" stroke="#2fd083" stroke-width="12" stroke-linecap="round"/>

    <!-- pot / tray -->
    <rect x="166" y="392" width="184" height="18" rx="9"/>
    <path d="M184 410 H332 L313 450 H203 Z"/>
    <rect x="208" y="450" width="24" height="12" rx="3"/>
    <rect x="284" y="450" width="24" height="12" rx="3"/>

    <!-- cloud pads -->
    <rect x="238" y="90"  width="48"  height="26" rx="13"/>
    <rect x="196" y="118" width="150" height="34" rx="17"/>
    <rect x="150" y="158" width="252" height="38" rx="19"/>
    <rect x="346" y="144" width="72"  height="32" rx="16"/>
    <rect x="118" y="204" width="238" height="40" rx="20"/>
    <rect x="318" y="208" width="74"  height="34" rx="17"/>
    <rect x="92"  y="298" width="122" height="34" rx="17"/>
    <rect x="104" y="280" width="56"  height="24" rx="12"/>
  </g>
  <!-- subtle top highlight -->
  <rect x="210" y="124" width="92" height="20" rx="10" fill="#79f0bf" opacity="0.5"/>
</svg>
