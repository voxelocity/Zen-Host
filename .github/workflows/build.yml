name: Build

# macOS and Linux packages have to be produced on their own operating systems —
# electron-builder cannot make a .dmg or an AppImage from Windows. Each job below
# runs on native hardware for its target, including real arm64 runners.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win --x64
          - name: Windows arm64
            os: windows-latest
            args: --win --arm64
          - name: macOS arm64 (Apple Silicon)
            os: macos-latest
            args: --mac --arm64
          - name: macOS x64 (Intel)
            os: macos-13
            args: --mac --x64
          - name: Linux x64
            os: ubuntu-latest
            args: --linux --x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            args: --linux --arm64
            system_fpm: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder vendors an x86-only fpm, which cannot run on an arm64
      # host, so .deb packaging needs the system fpm there instead.
      - name: Install system fpm (arm64 .deb)
        if: matrix.system_fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm --no-document

      - name: Regenerate icons
        run: npm run icons

      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_SYSTEM_FPM: ${{ matrix.system_fpm && 'true' || '' }}
          # Unsigned builds. Add CSC_LINK / CSC_KEY_PASSWORD secrets to sign macOS,
          # and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID to notarize.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zen-host-${{ matrix.os }}-${{ strategy.job-index }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.tar.gz

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
